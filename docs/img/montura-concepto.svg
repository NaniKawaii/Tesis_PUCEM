<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="860" height="640" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Montura altacimutal de un brazo · vista frontal (concepto)</text>
  <defs>
    <pattern id="rayado" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.5"/>
    </pattern>
    <marker id="pt" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5"><circle cx="3" cy="3" r="2.5" fill="#444"/></marker>
  </defs>

  <!-- suelo -->
  <line x1="200" y1="610" x2="660" y2="610" stroke="#999" stroke-width="2"/>

  <!-- trípode de topografía -->
  <g stroke="#555" stroke-width="7" stroke-linecap="round">
    <line x1="400" y1="440" x2="270" y2="608"/>
    <line x1="460" y1="440" x2="590" y2="608"/>
  </g>
  <line x1="430" y1="440" x2="430" y2="608" stroke="#999" stroke-width="7" stroke-linecap="round"/>
  <rect x="370" y="426" width="120" height="16" rx="3" fill="#777"/>

  <!-- batería colgada -->
  <line x1="410" y1="442" x2="395" y2="520" stroke="#555" stroke-width="1.5"/>
  <line x1="450" y1="442" x2="465" y2="520" stroke="#555" stroke-width="1.5"/>
  <rect x="380" y="520" width="100" height="52" rx="4" fill="#d6ecd2" stroke="#2f7d32" stroke-width="2"/>
  <text x="430" y="542" text-anchor="middle" font-weight="bold" fill="#1b5e20">LiFePO4</text>
  <text x="430" y="559" text-anchor="middle" fill="#1b5e20">12,8 V 12 Ah</text>

  <!-- base fija -->
  <rect x="345" y="350" width="170" height="76" rx="4" fill="#e8eef7" stroke="#3b5b8f" stroke-width="2"/>
  <rect x="355" y="362" width="44" height="54" fill="#5a6b80"/>
  <text x="377" y="393" text-anchor="middle" fill="#fff" font-size="11">Az</text>
  <rect x="368" y="350" width="18" height="8" fill="#c0392b"/>
  <rect x="410" y="362" width="96" height="54" rx="3" fill="#ffffff" stroke="#3b5b8f"/>
  <text x="458" y="384" text-anchor="middle" font-size="11">Base fija</text>
  <text x="458" y="400" text-anchor="middle" font-size="11">(tuerca 5/8″)</text>
  <rect x="515" y="372" width="22" height="16" fill="#f1c40f" stroke="#8a6d00"/>

  <!-- rodamiento giratorio y plato -->
  <rect x="352" y="336" width="156" height="14" fill="url(#rayado)" stroke="#555"/>
  <rect x="338" y="322" width="184" height="14" rx="2" fill="#b9c7da" stroke="#3b5b8f" stroke-width="2"/>
  <line x1="377" y1="350" x2="377" y2="336" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 2"/>

  <!-- eje de azimut -->
  <line x1="430" y1="70" x2="430" y2="445" stroke="#3b5b8f" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="430" y="62" text-anchor="middle" fill="#3b5b8f" font-weight="bold">eje de azimut</text>

  <!-- brazo -->
  <rect x="458" y="128" width="40" height="194" fill="#d7dbe0" stroke="#555" stroke-width="2"/>

  <!-- eje de altitud -->
  <line x1="300" y1="160" x2="520" y2="160" stroke="#222" stroke-width="5"/>
  <rect x="452" y="152" width="10" height="16" fill="#222"/>
  <rect x="494" y="152" width="10" height="16" fill="#222"/>

  <!-- polea y correa de altitud -->
  <rect x="512" y="118" width="10" height="84" rx="2" fill="#c0392b"/>
  <line x1="513" y1="202" x2="513" y2="262" stroke="#c0392b" stroke-width="2"/>
  <line x1="521" y1="202" x2="521" y2="262" stroke="#c0392b" stroke-width="2"/>
  <rect x="510" y="262" width="14" height="8" fill="#c0392b"/>
  <rect x="500" y="270" width="44" height="44" fill="#5a6b80"/>
  <text x="522" y="297" text-anchor="middle" fill="#fff" font-size="11">Alt</text>
  <rect x="524" y="152" width="10" height="16" fill="#8e44ad"/>

  <!-- fines de carrera -->
  <rect x="526" y="118" width="12" height="8" fill="#e67e22"/>
  <rect x="526" y="194" width="12" height="8" fill="#e67e22"/>

  <!-- placa de montaje y tubo -->
  <rect x="330" y="148" width="122" height="24" rx="3" fill="#f3e3c3" stroke="#a0782c" stroke-width="2"/>
  <circle cx="265" cy="160" r="62" fill="#2c3e50" stroke="#111" stroke-width="2"/>
  <circle cx="265" cy="160" r="46" fill="#3d5a73"/>
  <circle cx="265" cy="160" r="16" fill="#1c2833"/>
  <line x1="300" y1="160" x2="330" y2="160" stroke="#222" stroke-width="5"/>

  <!-- etiquetas -->
  <g fill="#222">
    <line x1="203" y1="160" x2="120" y2="110" stroke="#444" marker-end="url(#pt)"/>
    <text x="20" y="84" font-weight="bold">Telescopio liviano</text>
    <text x="20" y="100">vista de frente · ≤ 3 kg</text>

    <line x1="350" y1="172" x2="285" y2="246" stroke="#444" marker-end="url(#pt)"/>
    <text x="20" y="250" font-weight="bold">Mordaza Vixen universal</text>
    <text x="20" y="266">cualquier tubo ≤ 3 kg con barra</text>
    <text x="20" y="282">Vixen; se desliza para balancear</text>

    <line x1="345" y1="329" x2="212" y2="333" stroke="#444" marker-end="url(#pt)"/>
    <text x="20" y="322" font-weight="bold">Plato giratorio</text>
    <text x="20" y="338">corona GT2 de 280T (14:1)</text>

    <line x1="365" y1="343" x2="212" y2="389" stroke="#444" marker-end="url(#pt)"/>
    <text x="20" y="378" font-weight="bold">Rodamiento “lazy susan”</text>
    <text x="20" y="394">de 4″ (102 mm)</text>

    <line x1="365" y1="400" x2="205" y2="449" stroke="#444" marker-end="url(#pt)"/>
    <text x="20" y="438" font-weight="bold">Motor de azimut</text>
    <text x="20" y="454">fijo en la base, polea 20T</text>

    <line x1="292" y1="580" x2="240" y2="521" stroke="#444" marker-end="url(#pt)"/>
    <text x="20" y="510" font-weight="bold">Trípode de topografía</text>
    <text x="20" y="526">aluminio, rosca 5/8″ (comprado)</text>

    <line x1="480" y1="240" x2="640" y2="240" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="235" font-weight="bold">Brazo</text>
    <text x="645" y="251">perfil aluminio 2040</text>
    <text x="645" y="267">+ piezas de PETG</text>

    <line x1="500" y1="160" x2="640" y2="64" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="60" font-weight="bold">Eje de altitud</text>
    <text x="645" y="76">acero 8 mm en 2× 608ZZ</text>

    <line x1="522" y1="135" x2="640" y2="110" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="106" font-weight="bold">Polea GT2 grande (5:1)</text>

    <line x1="533" y1="160" x2="640" y2="150" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="146" font-weight="bold">AS5600</text>
    <text x="645" y="162">imán en el extremo del eje</text>

    <line x1="538" y1="198" x2="640" y2="196" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="192" font-weight="bold">2 fines de carrera</text>
    <text x="645" y="208">−5° y 90° (mismo pin)</text>

    <line x1="540" y1="292" x2="640" y2="305" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="301" font-weight="bold">Motor de altitud</text>
    <text x="645" y="317">ranuras para tensar la correa</text>

    <line x1="537" y1="380" x2="640" y2="372" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="368" font-weight="bold">GPS NEO-6M</text>
    <text x="645" y="384">antena hacia el cielo</text>

    <line x1="506" y1="410" x2="640" y2="430" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="426" font-weight="bold">Caja de control al costado</text>
    <text x="645" y="442">RPi 4, 2× TB6600, GPS, GY-91</text>

    <line x1="480" y1="546" x2="640" y2="530" stroke="#444" marker-end="url(#pt)"/>
    <text x="645" y="526" font-weight="bold">Batería colgada</text>
    <text x="645" y="542">baja el centro de gravedad</text>
    <text x="645" y="558">(no gira con la montura)</text>
  </g>
</svg>
