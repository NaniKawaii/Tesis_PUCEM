  <g fill="#111">
    <text x="22" y="74" font-weight="bold">Mecánico</text><text x="22" y="94">Montura altacimutal</text><text x="22" y="112">paramétrica (OpenSCAD)</text><text x="22" y="130">Reducciones 14:1 y 5:1</text>
    <text x="22" y="179" font-weight="bold">Electrónico</text><text x="22" y="199">Raspberry Pi 4, TB6600,</text><text x="22" y="217">NEMA 23, GPS, IMU,</text><text x="22" y="235">encoder, LiFePO4</text>
